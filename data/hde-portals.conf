# xdg-desktop-portal backends for HDE (XDG_CURRENT_DESKTOP=HDE), X11 and Wayland sessions:
# file chooser, settings, ... from the GTK portal; screenshots and screen sharing on Wayland from the wlroots portal
# (xdg-desktop-portal-wlr), falling back to the GTK portal on X11.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr;gtk
org.freedesktop.impl.portal.ScreenCast=wlr;gtk
