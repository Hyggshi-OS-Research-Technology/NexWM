# NexWM Configuration File
# Default location: ~/.config/nexwm/nexwm.conf

# Modifier key: Mod4 = Super/Windows, Mod1 = Alt
modkey = Mod4

# Default programs
terminal = nex-terminal
launcher = dmenu_run

# Appearance
border_width = 2
border_focus = #5b8dd9
border_normal = #444444
gaps = 8

# Background (wallpaper) — path to an image and how it is displayed
#   wallpaper =         (leave empty for no image / solid color)
#   wallpaper_mode =    scale | stretch | center | tile
# wallpaper = /path/to/wallpaper.png
# wallpaper_mode = scale

# Behavior
focus_follows_mouse = true
workspace_count = 9
default_layout = tiled

# Window rules
# rule {
#     class = "Gimp"
#     floating = true
# }
