# theme.conf — everything the HDE login screen shows. Values left out (or emptied) keep the defaults of the theme,
# so this file can be as short as `[General] accent=#f66151`.
#
# The keys are read by Main.qml (see "reading theme.conf" at the top of it). Colours are #rrggbb. Booleans are
# true / false (yes / no / 1 / 0 work too).
[General]
# the accent colour: the line on the card, the focus of the fields, the buttons, the chosen user
accent=#3584e4
# the background: a picture of this theme (assets/background.png, drawn by tools/make-background.py), the path of
# another picture, or a plain colour like #0e1520
background=assets/background.png
# how much the picture is dimmed (0 = as it is, 1 = dark), so that the white text stays readable
dim=0.30
# a line under the title: the greeting of the theme ("" shows nothing)
greeting=
# the font family of the login screen ("" = the font of the system)
fontFamily=
# what to show
showLogo=true
showClock=true
showHost=true
showSession=true
showLayout=true
showPower=true
# the clock: 24-hour time, the seconds, the date, and where it is (top-left, top-center, top-right)
clock24h=true
clockSeconds=false
clockDate=true
clockPosition=top-right
# the users of this computer as tiles. With no list to show — this set to false, or a greeter that hands over no
# users at all (SDDM leaves accounts out by uid range: [Users] MinimumUid / MaximumUid, and HideUsers / HideShells) —
# the screen shows a field to type a user name in instead, which is the only way in then
showUserList=true
# user: the list of the users of this computer, username: a field to type a name in
userMode=user
# the texts of the screen
title=Hyggshi Desktop Environment
loginHint=
capsLockMessage=Caps Lock is on
footer=HDE · Hyggshi OS
# the login card: how wide it is, and the buttons (wide = the full width of the card, compact = a small button)
cardWidth=400
buttonStyle=wide
