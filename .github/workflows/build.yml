name: Build & smoke-test HDE

on:
  push:
    branches: [ main, develop, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libgtk-3-dev libwnck-3-dev libxi-dev libxrandr-dev libx11-dev libgtk-layer-shell-dev \
          xvfb xdotool x11-utils x11-xserver-utils xinput dbus-x11 metacity openbox imagemagick \
          pulseaudio pulseaudio-utils libnotify-bin libglib2.0-bin adwaita-icon-theme python3 python3-dbusmock librsvg2-common \
          gsettings-desktop-schemas xserver-xephyr yaru-theme-gtk

    - name: Build (all targets)
      run: |
        set -o pipefail
        make -j"$(nproc)" 2>&1 | tee build.log || {
          echo "--- the lines that say what went wrong (the whole log is at the end of the job and in build.log):"
          grep -nE "error:|Error [0-9]|undefined reference|No rule to make|fatal error" build.log | tail -n 15 | sed 's/^/::error title=build::/'
          exit 1
        }

    - name: Compiler warnings
      if: always()
      run: |
        n=$(grep -c "warning:" build.log || true)
        echo "compiler warnings: $n"
        grep "warning:" build.log | sort -u | head -n 10 | sed 's/^/::warning::/' || true

    - name: Smoke test in Xvfb (Start menu layouts, panel settings, About logos, Super key, F1-F3, F6-F8, notifications, screenshots, Wi-Fi, Dark mode, Hyggshi Files, WM switch)
      run: make check

    - name: Try it in a window (scripts/test-nexde --check, a nested HDE session in Xephyr)
      if: always()
      run: xvfb-run -a -s "-screen 0 1440x900x24" sh scripts/test-nexde --check --keep-logs 1280x720

    - name: Report results
      if: always()
      run: python3 tests/ci-annotate.py /tmp/hde-smoke results

    # Screenshots as check runs (only when the commit message contains "[shots]" or on a manual run)
    - name: Publish screenshots
      if: always() && matrix.os == 'ubuntu-22.04' && (contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 tests/ci-annotate.py /tmp/hde-smoke checkruns

    - name: Upload test output (logs + screenshots)
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: hde-smoke-${{ matrix.os }}
        path: |
          /tmp/hde-smoke/*.log
          /tmp/hde-smoke/*.txt
          /tmp/hde-smoke/shot-*.png
          build.log

  # Touchpad / mouse settings against the REAL X input drivers: Xorg (dummy video) + libinput + synaptics + evdev, with
  # virtual uinput devices (needs root and /dev/uinput, which the GitHub VMs have; containers do not).
  touchpad:
    name: touchpad (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libgtk-3-dev libxi-dev libxrandr-dev libx11-dev \
          xserver-xorg-core xserver-xorg-video-dummy xserver-xorg-input-libinput xserver-xorg-input-synaptics \
          xserver-xorg-input-evdev xinput x11-utils xdotool dbus-x11 python3 python3-evdev imagemagick \
          adwaita-icon-theme librsvg2-common

    - name: Build hde-xsettings and hde-settings
      run: make -j"$(nproc)" build/hde-xsettings build/hde-settings

    - name: Touchpad test (scroll direction, tap to click, hotplug, live changes, other programs, real swipes, touchpads seen as a mouse)
      run: sh tests/input-test.sh

    - name: Report results
      if: always()
      run: python3 tests/ci-annotate.py /tmp/hde-input results "HDE touchpad test"

    - name: Publish screenshots
      if: always() && matrix.os == 'ubuntu-24.04' && (contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 tests/ci-annotate.py /tmp/hde-input checkruns

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: hde-touchpad-${{ matrix.os }}
        path: |
          /tmp/hde-input/*.log
          /tmp/hde-input/*.txt
          /tmp/hde-input/shot-*.png

  # Several screens for real: Xorg with the dummy video driver, whose 16 RandR outputs (xf86-video-dummy >= 0.4.0, so
  # Ubuntu 24.04) act as connectors: F8 / Super+P Project window, Extend / Duplicate / Second screen only / PC screen
  # only, the panel and desktop following, F6/F7 software dimming, Night Light, a screen plugged in, a fake backlight.
  display:
    name: screens (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libgtk-3-dev libwnck-3-dev libxi-dev libxrandr-dev libx11-dev \
          xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils x11-utils xdotool dbus-x11 metacity \
          imagemagick adwaita-icon-theme librsvg2-common python3

    - name: Build
      run: make -j"$(nproc)"

    - name: Screens test (F8 Project, Extend / Duplicate / Second screen only, F6/F7, Night Light, hotplug, backlight)
      run: sh tests/display-test.sh

    - name: Report results
      if: always()
      run: python3 tests/ci-annotate.py /tmp/hde-display results "HDE screens test"

    - name: Publish screenshots
      if: always() && (contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 tests/ci-annotate.py /tmp/hde-display checkruns

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: hde-screens-${{ matrix.os }}
        path: |
          /tmp/hde-display/*.log
          /tmp/hde-display/*.txt
          /tmp/hde-display/shot-*.png

  # Hyggshi Media, the picture viewer (the first part of HDE's multimedia) driven for real in Xvfb: a folder of
  # solid-coloured pictures of known sizes, the arrow keys, the zoom keys and the mouse wheel, the rotation, the
  # slideshow running by itself, full screen, the pixels of the picture on the screen, and a second hde-media handing
  # its picture to the window that is already open. See tests/media-test.sh
  media:
    name: Hyggshi Media, the picture viewer
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libgtk-3-dev xvfb xdotool metacity dbus-x11 imagemagick \
          adwaita-icon-theme librsvg2-common python3 procps
        pkg-config --modversion gtk+-3.0 | sed 's/^/::notice::GTK3 /'

    - name: Build (hde-media and its unit test, not the other targets of the session)
      run: |
        set -o pipefail
        make -j"$(nproc)" build/hde-media build/media-test 2>&1 | tee build.log || {
          echo "--- the lines that say what went wrong (the whole log is at the end of the job and in build.log):"
          grep -nE "error:|Error [0-9]|undefined reference|No rule to make|fatal error" build.log | tail -n 15 | sed 's/^/::error title=build::/'
          exit 1
        }

    - name: Unit test (the list, the order, the zoom ladder, the slideshow clock)
      run: build/media-test

    - name: Picture viewer test (arrows, zoom, rotation, slideshow, full screen, one window, one process)
      run: sh tests/media-test.sh

    - name: Report results
      if: always()
      run: python3 tests/ci-annotate.py /tmp/hde-media results "Hyggshi Media test"

    - name: Publish screenshots
      if: always() && (contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 tests/ci-annotate.py /tmp/hde-media checkruns

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: hde-media-viewer
        path: |
          /tmp/hde-media/*.log
          /tmp/hde-media/*.txt
          /tmp/hde-media/shot-*.png

  # The "HDE (Wayland)" session for real, on Debian 13 (Hyggshi OS's base): labwc with its headless backend and the pixman
  # renderer (no screen or GPU needed), started by hde-start --wayland; grim takes the screenshots, wtype types keys.
  wayland:
    name: wayland (debian:trixie, labwc)
    runs-on: ubuntu-24.04
    container: debian:trixie
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential pkg-config libgtk-3-dev libwnck-3-dev libxi-dev libxrandr-dev libx11-dev libgtk-layer-shell-dev \
          libwayland-dev labwc xwayland grim wtype dbus zenity libnotify-bin libglib2.0-bin imagemagick \
          adwaita-icon-theme librsvg2-common fonts-dejavu-core procps python3 ca-certificates
        labwc --version; pkg-config --modversion gtk-layer-shell-0 wayland-client

    - name: Build (with the Wayland taskbar)
      run: |
        set -o pipefail
        make -j"$(nproc)" 2>&1 | tee build.log || {
          echo "--- the lines that say what went wrong (the whole log is at the end of the job and in build.log):"
          grep -nE "error:|Error [0-9]|undefined reference|No rule to make|fatal error" build.log | tail -n 15 | sed 's/^/::error title=build::/'
          exit 1
        }
        grep -q "HAVE_WAYLAND_TASKBAR" build.log || { echo "::error::hde-panel was built without the Wayland taskbar"; exit 1; }

    - name: Wayland session test (labwc, layer shell, Start menu, Super key, taskbar, PrtSc with grim, logout)
      run: sh tests/wayland-test.sh

    - name: Report results
      if: always()
      run: python3 tests/ci-annotate.py /tmp/hde-wayland results "HDE Wayland test"

    - name: Publish screenshots
      if: always() && (contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 tests/ci-annotate.py /tmp/hde-wayland checkruns

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: hde-wayland
        path: |
          /tmp/hde-wayland/*.log
          /tmp/hde-wayland/*.txt
          /tmp/hde-wayland/*.out
          /tmp/hde-wayland/shot-*.png
          /tmp/hde-wayland/home/.config/hde/labwc/*

  # packaging/hyggshi-os/build-nexwm.sh, the script that puts HDE into the Hyggshi OS ISO, run the way the ISO build runs
  # it (as root in a fresh Debian 13, here a container instead of the chroot): build, install into /usr, remove the
  # build tools; then the installed session starts in Xvfb.
  hyggshi-os:
    name: Hyggshi OS install script (debian:trixie)
    runs-on: ubuntu-24.04
    container: debian:trixie
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - name: build-nexwm.sh
      run: |
        set +e
        NEXWM_LOCAL_SRC="$GITHUB_WORKSPACE" bash packaging/hyggshi-os/build-nexwm.sh 2>&1 | tee /tmp/build-nexwm.log
        rc=${PIPESTATUS[0]}
        grep -E "^(note|ERROR|E): " /tmp/build-nexwm.log | sort -u | head -n 20 | sed 's/^/::warning::build-nexwm.sh: /'
        if [ "$rc" != 0 ]; then
          tail -n 25 /tmp/build-nexwm.log | sed 's/^/::error::build-nexwm.sh: /'
          exit "$rc"
        fi

    - name: The installed session
      run: |
        set -e
        cat /usr/share/xsessions/hde.desktop /usr/share/wayland-sessions/hde-wayland.desktop
        for p in hde-start hde-session hde-desktop hde-panel hde-settings hde-hotkeys hde-xsettings hde-screenshot hde-files; do
          test -x "/usr/bin/$p" || { echo "::error::/usr/bin/$p is missing"; exit 1; }
        done
        if command -v gcc; then echo "::error::the build tools were not removed"; exit 1; fi
        /usr/bin/hde-settings --version
        /usr/bin/hde-files --version
        grep -q "^inode/directory=hde-files.desktop" /usr/share/applications/hde-mimeapps.list
        /usr/bin/hde-settings --power
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth x11-utils fonts-dejavu-core
        export HOME=/tmp/hde-home XDG_RUNTIME_DIR=/tmp/hde-run
        mkdir -p "$HOME" "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
        xvfb-run -a -s "-screen 0 1280x800x24" sh -c '
          dbus-run-session -- /usr/bin/hde-session > /tmp/hde-session.log 2>&1 &
          for i in $(seq 1 100); do xprop -root _HDE_PANEL_WINDOW 2>/dev/null | grep -q "window id" && break; sleep 0.2; done
          xprop -root _HDE_PANEL_WINDOW; sleep 2
          pgrep -a hde- || true' | tee /tmp/hde-run.txt
        cat /tmp/hde-session.log | head -n 40
        grep -q "window id" /tmp/hde-run.txt || { echo "::error::the installed HDE session did not start its panel"; exit 1; }

  # Fedora — the other half of HDE's world (and of its package names): dnf's toolchain, Fedora's headers and library
  # versions, Fedora's package names in every message HDE prints, Fedora's os-release in About, Qt's SDDM greeter,
  # labwc on Fedora. tests/fedora-test.sh --full is a real session in Xvfb plus what is Fedora about it.
  #
  # The dependencies come from packaging/fedora/deps.sh, the same file packaging/fedora/README.md documents:
  # Fedora renames packages between releases (wlroots, the split up xorg-x11-* tools), so the script picks what this
  # Fedora has.
  fedora:
    name: Fedora (dnf, full desktop)
    runs-on: ubuntu-24.04
    container: fedora:latest
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - name: Install the dependencies (packaging/fedora/deps.sh)
      run: |
        cat /etc/fedora-release
        sh packaging/fedora/deps.sh install build runtime-minimal runtime-full test wayland-session
        rpm -q gtk3-devel libwnck3-devel gtk-layer-shell-devel | sed 's/^/::notice::Fedora package: /'

    - name: Build (all targets)
      run: |
        set -o pipefail
        make -j"$(nproc)" 2>&1 | tee build.log || {
          echo "--- the lines that say what went wrong (the whole log is at the end of the job and in build.log):"
          grep -nE "error:|Error [0-9]|undefined reference|No rule to make|fatal error" build.log | tail -n 15 | sed 's/^/::error title=build::/'
          exit 1
        }
        for p in hde-session hde-desktop hde-panel hde-settings hde-hotkeys hde-xsettings hde-screenshot hde-files hde-media; do
          test -x "build/$p" || { echo "::error::build/$p was not built"; exit 1; }
        done
        grep -q "HAVE_WAYLAND_TASKBAR" build.log || echo "::warning::hde-panel was built without the Wayland taskbar"

    - name: Compiler warnings
      if: always()
      run: |
        n=$(grep -c "warning:" build.log || true)
        echo "compiler warnings (Fedora $(gcc -dumpfullversion)): $n"
        grep "warning:" build.log | sort -u | head -n 10 | sed 's/^/::warning::fedora: /' || true

    - name: Fedora test (the Fedora package names, a session in Xvfb, SDDM, labwc)
      run: |
        set -o pipefail
        sh tests/fedora-test.sh --full 2>&1 | tee -a build.log

    - name: Report results
      if: always()
      run: python3 tests/ci-annotate.py /tmp/hde-fedora results "HDE on Fedora"

    - name: Publish screenshots
      if: always() && (contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 tests/ci-annotate.py /tmp/hde-fedora checkruns

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: hde-fedora
        path: |
          /tmp/hde-fedora/*.txt
          /tmp/hde-fedora/*.log
          /tmp/hde-fedora/shot-*.png
          /tmp/hde-fedora/sddm/**
          build.log

  # Base Fedora: a Fedora with *nothing* but what compiles HDE (packaging/fedora/deps.sh list build) and Xvfb — no
  # window manager, no icon theme, no NetworkManager, no labwc. HDE must build, the unit tests must pass and the
  # session must come up and degrade gracefully (say what is missing, with dnf hints, and keep running). This is what
  # a user gets who installs HDE on a minimal Fedora server install, so it is a test of its own.
  fedora-base:
    name: Fedora base (minimal, no desktop packages)
    runs-on: ubuntu-24.04
    container: fedora:latest
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - name: Install ONLY the build dependencies (plus Xvfb for the test itself)
      run: |
        cat /etc/fedora-release
        sh packaging/fedora/deps.sh install build
        # Xvfb, dbus-daemon (the package that has dbus-run-session on Fedora: the test runs the session inside one), python3, procps-ng, rpm, a font:
        # the test harness, not HDE. No window manager, no icons, no NetworkManager.
        dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xvfb dbus-daemon python3 procps-ng rpm dejavu-sans-fonts ||
          dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xvfb dbus-daemon python3 procps-ng rpm
        for p in metacity openbox xfwm4 NetworkManager labwc; do
          if rpm -q "$p" >/dev/null 2>&1; then echo "::warning::$p is installed: this is not a base Fedora any more"; fi
        done

    - name: Build (all targets)
      run: |
        set -o pipefail
        make -j"$(nproc)" 2>&1 | tee build.log || {
          echo "--- the lines that say what went wrong (the whole log is at the end of the job and in build.log):"
          grep -nE "error:|Error [0-9]|undefined reference|No rule to make|fatal error" build.log | tail -n 15 | sed 's/^/::error title=build::/'
          exit 1
        }

    - name: Unit tests (no X server needed)
      run: |
        set -o pipefail
        make check-unit 2>&1 | tee -a build.log

    - name: Unit test results on the summary (the failures; the log above has the rest)
      if: always()
      run: |
        mkdir -p /tmp/hde-fedora-units
        grep -E "^(PASS|FAIL|==) " build.log > /tmp/hde-fedora-units/results.txt || true
        python3 tests/ci-annotate.py /tmp/hde-fedora-units results "HDE unit tests on a base Fedora"

    - name: Fedora base test (a session without any desktop package)
      if: always()
      run: sh tests/fedora-test.sh --base

    - name: Report results
      if: always()
      run: python3 tests/ci-annotate.py /tmp/hde-fedora results "HDE on a base Fedora"

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: hde-fedora-base
        path: |
          /tmp/hde-fedora/*.txt
          /tmp/hde-fedora/*.log
          /tmp/hde-fedora/shot-*.png
          build.log

  # HDE mostly runs on Debian-based systems (Hyggshi OS defaults to Debian 13): build with their compilers too.
  # Debian 13 has GCC 14 (implicit declarations and pointer/int mix-ups are errors); testing has the newest GCC,
  # which compiles C23 by default (bool/true/false are keywords, "f()" means "f(void)").
  # The HDE login screen (login/sddm/): its own job, because a login screen fails in its own ways. The theme is
  # checked on its own first (the files SDDM needs, metadata.desktop, the QML, theme.conf, the installer — no display
  # needed), then installed the way a user installs it (sudo sh login/sddm/install.sh), and then rendered for real in
  # SDDM's greeter in Xvfb: the test reads the greeter's log for QML errors and looks at the pixels of the screen (the
  # dark background, the card, the accent line on it). Ubuntu's SDDM is the Qt 5 greeter; the Fedora job above renders
  # the same theme in the Qt 6 greeter, so both greeters this theme claims to support are tested for real.
  sddm-theme:
    name: SDDM login theme (Qt 5 greeter)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - name: Install SDDM, its greeter, Xvfb and a screenshot tool
      run: |
        sudo apt-get update
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
          sddm xvfb imagemagick x11-utils python3
        dpkg -l sddm | tail -n 1
        command -v sddm-greeter-qt6 || command -v sddm-greeter || echo "::warning::no SDDM greeter binary found"

    - name: The theme, its configuration and its installer (no display needed)
      run: sh tests/sddm-test.sh --no-render

    - name: Install it the way a user does, and check what lands where
      run: |
        sudo sh login/sddm/install.sh --dry-run
        sudo sh login/sddm/install.sh --default-session
        echo "--- /etc/sddm.conf.d/50-hde-theme.conf"
        cat /etc/sddm.conf.d/50-hde-theme.conf
        test -f /usr/share/sddm/themes/hde/Main.qml
        test -f /usr/share/sddm/themes/hde/components/HdePassword.qml
        test -f /usr/share/sddm/themes/hde/assets/background.png
        grep -E "^(QtVersion|Theme-Id|Type)=" /usr/share/sddm/themes/hde/metadata.desktop
        du -sh /usr/share/sddm/themes/hde

    - name: Render the theme in SDDM's greeter (Xvfb)
      run: sh tests/sddm-test.sh

    - name: Report results
      if: always()
      run: python3 tests/ci-annotate.py /tmp/hde-sddm results "HDE login screen"

    - name: Upload the pictures of the login screen
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: hde-sddm-login
        path: |
          /tmp/hde-sddm/*.txt
          /tmp/hde-sddm/*.log
          /tmp/hde-sddm/shot-*.png

  build-debian:
    name: build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    continue-on-error: ${{ matrix.image == 'debian:testing' }}
    strategy:
      fail-fast: false
      matrix:
        image: [ 'debian:trixie', 'debian:testing' ]
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - name: Install build dependencies
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential pkg-config libgtk-3-dev libwnck-3-dev libxi-dev libxrandr-dev libx11-dev libgtk-layer-shell-dev
        gcc --version | head -n1

    - name: Build (all targets)
      run: |
        set -o pipefail
        make -j"$(nproc)" 2>&1 | tee build.log || {
          echo "--- the lines that say what went wrong (the whole log is at the end of the job and in build.log):"
          grep -nE "error:|Error [0-9]|undefined reference|No rule to make|fatal error" build.log | tail -n 15 | sed 's/^/::error title=build::/'
          exit 1
        }
        for p in hde-session hde-desktop hde-panel hde-settings hde-hotkeys hde-xsettings hde-screenshot hde-files hde-media; do
          test -x "build/$p" || { echo "::error::build/$p was not built"; exit 1; }
        done

    - name: Compiler warnings
      if: always()
      run: |
        n=$(grep -c "warning:" build.log || true)
        echo "compiler warnings ($(gcc -dumpfullversion)): $n"
        grep "warning:" build.log | sort -u | head -n 10 | sed "s/^/::warning::${{ matrix.image }}: /" || true
